name: RSPS daily

on:
  schedule:
    - cron: '15 0 * * *'      # 00:15 UTC chaque jour (après la clôture des bougies 1D crypto)
  workflow_dispatch: {}         # exécution manuelle possible

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: pip install -r requirements.txt

      - name: Run RSPS
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT:  ${{ secrets.TG_CHAT }}
          NOTIFY:   change       # 'always' pour notifier à chaque run
        run: python runner.py

      - name: Robustesse
        run: python robustness.py || echo "robustesse en échec, version précédente conservée"

      - name: Commit state
        run: |
          git config user.name  "rsps-bot"
          git config user.email "bot@montaigne.local"
          git add state/ docs/ seed/ 2>/dev/null || true
          git commit -m "RSPS update $(date -u +%F)" || echo "rien à committer"
          git push || echo "rien à pousser"
